2 題答對各 +70"],["Overcharge｜過載充能","目前 Combo ×25 轉成分數"]]},"cap":{"name":"Captain America","passive":"Shield Discipline｜盾牌紀律：第一次答錯不斷 Combo。弱點：速度分上限較低。","b":[["Shield Charge｜盾牌衝鋒","立即 +120"],["Hold the Line｜守住陣線","未來 2 題答錯不斷 Combo"],["Perfect Formation｜完美陣型","Combo ≥3 立即 +220；否則 +100"]]},"thor":{"name":"Thor","passive":"God of Thunder｜雷神之力：HARD / GRAMMAR 題答對 +55。弱點：前 5 題速度 -15。","b":[["Mjolnir Strike｜雷神之鎚","立即 +160"],["Lightning Chain｜連鎖閃電","接下來 2 題總分 ×1.3"],["Stormbreaker｜風暴破壞者","高難題 +250；一般題 +120"]]},"hulk":{"name":"Hulk","passive":"Hulk Smash｜浩克重擊：Combo ≥3 後每題 +60。弱點：低 Combo 時速度 -10。","b":[["Smash Bonus｜重擊加分","立即 +140"],["Rage Mode｜狂暴模式","接下來 3 題 Combo 額外 +40"],["Gamma Burst｜伽瑪爆發","Combo 每層 +30，最高 +300"]]},"thanos":{"name":"Thanos","passive":"Infinity Gauntlet｜無限手套：每題 +260；速度最低 +180；前 4 次答錯不斷 Combo。","b":[["Power Stone｜力量寶石","立即 +500；下一題答對再 +300"],["Time Stone｜時間寶石","接下來 4 題總分 ×1.7"],["Infinity Snap｜無限響指","立即 +450；Combo ≥3 再 +250"]]}};
const $=x=>document.getElementById(x);let sel="ironman",g=[],i=0,s=0,c=0,ok=0,t=240,timer=null,lock=false,start=0,used=[0,0,0],fast=0,jTurns=0,shield=0,thorTurns=0,hulkTurns=0,thanosTurns=0,capGuard=0,thanosGuard=0,team="";
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function unlocked(){return localStorage.getItem("bev_thanos")==="1"}function avatar(id){
 const art={

 hulk:`<svg viewBox="0 0 120 90"><rect width="120" height="90" fill="#07101a"/><path d="M34 14H86L101 31 91 70 73 84H47L29 70 19 31Z" fill="#66a75c"/><path d="M24 28Q60 4 96 28L85 35 69 28 52 34 38 28Z" fill="#25222a"/><rect x="39" y="42" width="15" height="5" fill="#151515"/><rect x="66" y="42" width="15" height="5" fill="#151515"/><path d="M45 61L60 67 76 61" stroke="#24321f" stroke-width="4" fill="none"/></svg>`,
 thanos:`<svg viewBox="0 0 120 90"><rect width="120" height="90" fill="#07101a"/><path d="M37 12H83L97 28 89 68 73 83H47L31 68 23 28Z" fill="#8d61aa"/><path d="M32 17H88L95 30 79 27 60 37 41 27 25 30Z" fill="#d1ac45"/><rect x="41" y="41" width="14" height="5" fill="#16151b"/><rect x="65" y="41" width="14" height="5" fill="#16151b"/><path d="M50 61H70" stroke="#593d6c" stroke-width="4"/><path d="M86 60Q108 57 113 72L104 86H88Z" fill="#d1ac45"/><circle cx="96" cy="68" r="3" fill="#60e8ff"/><circle cx="104" cy="69" r="3" fill="#ff6272"/><circle cx="100" cy="77" r="3" fill="#ffe84e"/></svg>`
 };

}function renderHeroes(){if(sel==="thanos"&&!unlocked())sel="ironman";$("heroGrid").innerHTML=Object.entries(H).filter(([id])=>id!=="thanos"||unlocked()).map(([id,h])=>`<div class="hero ${id==="thanos"?"thanos":""} ${sel===id?"active":""}" onclick="selHero('${id}')"><div class="avatar">${avatar(id)}</div><div class="name">${h.name}</div><div class="pass">${h.passive}</div></div>`).join("")}function selHero(id){sel=id;renderHeroes()}
function opts(q){

}
function startGame(){team=$("teamName").value||"Avengers";g=sh(BANK).slice(0,20);i=s=c=ok=0;t=240;used=[0,0,0];fast=jTurns=shield=thorTurns=hulkTurns=thanosTurns=capGuard=0;thanosGuard=sel==="thanos"?4:0;$("home").classList.add("hidden");$("game").classList.remove("hidden");$("team").textContent=team;$("hero").textContent=H[sel].name;renderBuffs();load();timer=setInterval(()=>{t--;update();if(t<=0)finish()},1000)}
function renderBuffs(){[1,2,3].forEach(n=>{$("b"+n).innerHTML=`<b>${H[sel].b[n-1][0]}</b><small style="display:block;margin-top:4px">${H[sel].b[n-1][1]}</small>`;$("b"+n).disabled=!!used[n-1]})}
function load(){if(i>=20)return finish();lock=false;let q=g[i],o=opts(q);$("level").textContent=q.level;$("question").textContent=q.q;$("kind").textContent=q.mode==="fill"?"Fill in the blank｜選出正確 beV":"Choose the correct sentence｜選出文法正確句子";$("options").innerHTML=o.map((x,n)=>`<button class="option" data-a="${x.replace(/"/g,"&quot;")}" onclick="answer(this.dataset.a)"><span class="letter">${String.fromCharCode(65+n)}</span><span>${x}</span></button>`).join("");$("feedback").textContent="READY";start=performance.now();update()}
function speed(sec){let b=Math.max(0,Math.round(180-sec*9));if(sel==="ironman"){b+=25;if(sec<=3)b+=30}if(sel==="cap")b=Math.min(140,b);if(sel==="thor"&&i<5)b=Math.max(0,b-15);if(sel==="hulk"&&c<3)b=Math.max(0,b-10);if(sel==="thanos")b=Math.max(180,b)+50;return b}
function answer(a){if(lock)return;lock=true;let q=g[i],yes=a===q.a,sec=(performance.now()-start)/1000;document.querySelectorAll(".option").forEach(b=>{b.disabled=true;if(b.dataset.a===q.a)b.classList.add("correct");else if(b.dataset.a===a)b.classList.add("wrong")});if(yes){c++;ok++;let gain=130+speed(sec)+(q.level==="HARD"?40:q.level==="EXPERT"?60:0)+Math.min(140,(c-1)*18);if(sel==="thor"&&q.mode==="grammar")gain+=55;if(sel==="hulk"&&c>=3)gain+=60;if(hulkTurns>0)gain+=40;if(sel==="thanos")gain+=260;if(fast&&sec<=3){gain+=fast;fast=0}if(jTurns>0){gain+=70;jTurns--}if(thorTurns>0){gain=Math.round(gain*1.3);thorTurns--}if(thanosTurns>0){gain=Math.round(gain*1.7);thanosTurns--}s+=gain;$("feedback").innerHTML=`✅ ${q.exp} <span class="gain">+${gain}</span>`}else{let protect=false;if(sel==="cap"&&!capGuard){capGuard=1;protect=true}if(shield>0){shield--;protect=true}if(sel==="thanos"&&thanosGuard>0){thanosGuard--;protect=true}if(!protect)c=0;if(sel==="ironman")s=Math.max(0,s-20);$("feedback").innerHTML=`❌ 正解：<b>${q.a}</b>｜${q.exp}`}if(hulkTurns>0)hulkTurns--;update();setTimeout(()=>{i++;load()},1200)}
function buff(n){if(used[n-1]||lock)return;used[n-1]=1;$("b"+n).disabled=true;if(sel==="ironman"){if(n===1){s+=150;fast=100}if(n===2)jTurns=2;if(n===3)s+=c*25}if(sel==="cap"){if(n===1)s+=120;if(n===2)shield=2;if(n===3)s+=c>=3?220:100}if(sel==="thor"){if(n===1)s+=160;if(n===2)thorTurns=2;if(n===3)s+=(g[i].level==="HARD"||g[i].level==="EXPERT")?250:120}if(sel==="hulk"){if(n===1)s+=140;if(n===2)hulkTurns=3;if(n===3)s+=Math.min(300,c*30)}if(sel==="thanos"){if(n===1){s+=500;fast=300}if(n===2)thanosTurns=4;if(n===3)s+=450+(c>=3?250:0)}$("feedback").textContent="BUFF ACTIVATED";update()}

function update(){$("time").textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");$("qnum").textContent=Math.min(i+1,20)+"/20";$("combo").textContent=c;$("score").textContent=s;$("timebar").style.width=(t/240*100)+"%"}
function rankData(){try{return JSON.parse(localStorage.getItem("bev_avengers_rank")||"{}")}catch(e){return{}}}function saveRank(){let d=rankData();d[team]=d[team]||{team,total:0,best:0,plays:0,hero:sel};d[team].total+=s;d[team].best=Math.max(d[team].best,s);d[team].plays++;d[team].hero=sel;localStorage.setItem("bev_avengers_rank",JSON.stringify(d))}function renderRank(){let r=Object.values(rankData()).sort((a,b)=>b.total-a.total).slice(0,10);$("ranking").innerHTML=r.length?r.map((x,n)=>`<div class="rank"><span>${n+1}. ${x.team}</span><span>${x.total}</span></div>`).join(""):"No data"}
